<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FERRAZ — Criar conta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container site-header__top">
    <a href="index.html" class="site-header__logo">
      <img src="assets/logo.png" alt="Logo FERRAZ">
      <span>FERRAZ</span>
    </a>
    <div class="site-header__acoes">
      <a href="carrinho.html" class="carrinho-link">
        Carrinho
        <span class="carrinho-link__contador" id="carrinho-contador">0</span>
      </a>
    </div>
  </div>
</header>

<main class="pagina-auth">
  <div class="resumo-pedido" id="etapa-formulario">
    <h1>Criar minha conta</h1>
    <p class="texto-suave">Leva menos de um minuto.</p>

    <div id="alerta-cadastro"></div>

    <form id="form-cadastro">
      <div class="campo">
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" required>
      </div>
      <div class="campo">
        <label for="email">E-mail</label>
        <input type="email" id="email" required autocomplete="username">
      </div>
      <div class="campo">
        <label for="telefone">Telefone / WhatsApp</label>
        <input type="tel" id="telefone" placeholder="(00) 00000-0000" required>
      </div>
      <div class="campo">
        <label for="senha">Senha</label>
        <div class="campo-senha">
          <input type="password" id="senha" required minlength="6" autocomplete="new-password">
          <button type="button" class="campo-senha__toggle" data-alvo="senha" aria-label="Mostrar senha"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
        <div class="medidor-senha" id="medidor-senha" style="display:none;">
          <div class="medidor-senha__barra"><div class="medidor-senha__preenchimento" id="medidor-preenchimento"></div></div>
          <span id="medidor-texto"></span>
        </div>
      </div>
      <div class="campo">
        <label for="confirmar_senha">Confirmar senha</label>
        <div class="campo-senha">
          <input type="password" id="confirmar_senha" required minlength="6" autocomplete="new-password">
          <button type="button" class="campo-senha__toggle" data-alvo="confirmar_senha" aria-label="Mostrar senha"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
        <p class="texto-suave" style="font-size:0.8rem; margin-top:4px;" id="texto-confirmar-senha"></p>
      </div>
      <button type="submit" class="btn btn-primario btn-bloco btn-grande" id="btn-cadastrar">Criar conta</button>
    </form>

    <p class="texto-suave" style="text-align:center; margin-top:20px;">
      Já tem conta? <a href="login.html">Entrar</a>
    </p>
  </div>

  <div class="resumo-pedido" id="etapa-codigo" style="display:none;">
    <h1>Confirme seu e-mail</h1>
    <p class="texto-suave">Enviamos um código de 6 dígitos para <strong id="email-destino"></strong>.</p>

    <div id="alerta-codigo"></div>

    <form id="form-codigo">
      <div class="campo">
        <label for="codigo">Código de confirmação</label>
        <input type="text" id="codigo" required maxlength="6" inputmode="numeric" placeholder="000000" style="text-align:center; font-size:1.4rem; letter-spacing:0.3em;">
      </div>
      <button type="submit" class="btn btn-primario btn-bloco btn-grande" id="btn-confirmar-codigo">Confirmar</button>
    </form>

    <p class="texto-suave" style="text-align:center; margin-top:20px;">
      Não recebeu? <button type="button" class="link-acao" id="btn-reenviar" style="background:none; border:none; cursor:pointer;">Reenviar código</button>
    </p>
  </div>
</main>

<footer class="site-footer">
  <div class="container"><p>© <span id="ano"></span> FERRAZ. Todos os direitos reservados.</p></div>
</footer>

<script src="js/api.js"></script>
<script src="js/cart.js"></script>
<script src="js/customer.js"></script>
<script>
document.getElementById('ano').textContent = new Date().getFullYear();

if (obterTokenCliente()) {
  window.location.href = 'conta.html';
}

let clienteIdPendente = null;

// ---------- Medidor de força de senha ----------
function avaliarForcaSenha(senha) {
  let pontos = 0;
  if (senha.length >= 6) pontos++;
  if (senha.length >= 10) pontos++;
  if (/[A-Z]/.test(senha) && /[a-z]/.test(senha)) pontos++;
  if (/[0-9]/.test(senha)) pontos++;
  if (/[^A-Za-z0-9]/.test(senha)) pontos++;

  if (pontos <= 1) return { nivel: 'fraca', texto: 'Senha fraca', cor: '#c0392b', largura: '33%' };
  if (pontos <= 3) return { nivel: 'media', texto: 'Senha média', cor: '#d99a1b', largura: '66%' };
  return { nivel: 'forte', texto: 'Senha forte', cor: '#2e7d5b', largura: '100%' };
}

document.getElementById('senha').addEventListener('input', (e) => {
  const medidor = document.getElementById('medidor-senha');
  const preenchimento = document.getElementById('medidor-preenchimento');
  const texto = document.getElementById('medidor-texto');

  if (!e.target.value) {
    medidor.style.display = 'none';
    return;
  }
  medidor.style.display = 'block';
  const resultado = avaliarForcaSenha(e.target.value);
  preenchimento.style.width = resultado.largura;
  preenchimento.style.background = resultado.cor;
  texto.textContent = resultado.texto;
  texto.style.color = resultado.cor;
});

function conferirSenhasIguais() {
  const senha = document.getElementById('senha').value;
  const confirmar = document.getElementById('confirmar_senha').value;
  const texto = document.getElementById('texto-confirmar-senha');
  if (!confirmar) { texto.textContent = ''; return true; }
  if (senha === confirmar) {
    texto.textContent = '✓ As senhas coincidem';
    texto.style.color = '#2e7d5b';
    return true;
  }
  texto.textContent = 'As senhas não coincidem';
  texto.style.color = '#c0392b';
  return false;
}
document.getElementById('confirmar_senha').addEventListener('input', conferirSenhasIguais);

// ---------- Etapa 1: formulário de cadastro ----------
document.getElementById('form-cadastro').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btn-cadastrar');
  const alertaEl = document.getElementById('alerta-cadastro');
  alertaEl.innerHTML = '';

  if (!conferirSenhasIguais()) {
    alertaEl.innerHTML = `<div class="alerta alerta-erro">As senhas não coincidem.</div>`;
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Criando conta...';

  const email = document.getElementById('email').value;

  try {
    const resultado = await apiFetch('/clientes/cadastro', {
      method: 'POST',
      body: JSON.stringify({
        nome: document.getElementById('nome').value,
        email,
        telefone: document.getElementById('telefone').value,
        senha: document.getElementById('senha').value,
        confirmar_senha: document.getElementById('confirmar_senha').value,
      }),
    });

    clienteIdPendente = resultado.cliente_id;
    document.getElementById('email-destino').textContent = email;
    document.getElementById('etapa-formulario').style.display = 'none';
    document.getElementById('etapa-codigo').style.display = 'block';

    if (resultado.codigo_simulado) {
      document.getElementById('alerta-codigo').innerHTML =
        `<div class="alerta" style="background:#fff8e6; color:#8a6d00; border:1px solid #f0e0a8;">
          Modo de teste (sem e-mail configurado): seu código é <strong>${resultado.codigo_simulado}</strong>
        </div>`;
    }
  } catch (err) {
    alertaEl.innerHTML = `<div class="alerta alerta-erro">${escapeHtml(err.message)}</div>`;
    btn.disabled = false;
    btn.textContent = 'Criar conta';
  }
});

// ---------- Etapa 2: confirmar código ----------
document.getElementById('form-codigo').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btn-confirmar-codigo');
  const alertaEl = document.getElementById('alerta-codigo');
  btn.disabled = true;
  btn.textContent = 'Confirmando...';

  try {
    await apiFetch('/clientes/cadastro/verificar', {
      method: 'POST',
      body: JSON.stringify({
        cliente_id: clienteIdPendente,
        codigo: document.getElementById('codigo').value,
      }),
    });

    // Conforme pedido: depois de confirmar, volta pra tela de login normal
    // (não loga automaticamente).
    window.location.href = 'login.html?confirmado=1';
  } catch (err) {
    alertaEl.innerHTML = `<div class="alerta alerta-erro">${escapeHtml(err.message)}</div>`;
    btn.disabled = false;
    btn.textContent = 'Confirmar';
  }
});

document.getElementById('btn-reenviar').addEventListener('click', async () => {
  const alertaEl = document.getElementById('alerta-codigo');
  try {
    const resultado = await apiFetch('/clientes/cadastro/reenviar-codigo', {
      method: 'POST',
      body: JSON.stringify({ cliente_id: clienteIdPendente }),
    });
    let msg = `<div class="alerta alerta-sucesso">Novo código enviado!</div>`;
    if (resultado.codigo_simulado) {
      msg = `<div class="alerta" style="background:#fff8e6; color:#8a6d00; border:1px solid #f0e0a8;">Modo de teste: novo código é <strong>${resultado.codigo_simulado}</strong></div>`;
    }
    alertaEl.innerHTML = msg;
  } catch (err) {
    alertaEl.innerHTML = `<div class="alerta alerta-erro">${escapeHtml(err.message)}</div>`;
  }
});
</script>
</body>
</html>
